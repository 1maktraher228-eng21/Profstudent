<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profstudent — мобильное приложение колледжа</title>
<style>
:root{--navy:#0a2540;--navy2:#123a66;--blue:#0f5fb8;--sky:#00afca;--gold:#fec50c;--bg:#f2f5f9;--card:#fff;--ink:#14213d;--mut:#6b7a90;--line:#e3e9f1;--ok:#14935a;--warn:#e8860c;--bad:#d64545}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:#08121f;overflow:hidden;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bg{position:fixed;inset:0;background:radial-gradient(900px 500px at 15% 0%,#12406f55,transparent),radial-gradient(800px 500px at 90% 100%,#00afca33,transparent),linear-gradient(160deg,#0a1b30,#06101c);z-index:-1}
/* top bar */
.top{height:58px;display:flex;align-items:center;gap:16px;padding:0 20px;color:#fff;border-bottom:1px solid #ffffff14;background:#0a1b30cc;backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px}.brand b{font-size:16px;letter-spacing:.5px}.brand small{display:block;color:#9fb3cc;font-size:11px}
.seg{display:flex;background:#ffffff14;border-radius:12px;padding:3px;margin-left:auto}
.seg button{color:#cfe0f5;padding:7px 14px;border-radius:9px;display:flex;gap:7px;align-items:center;font-weight:600;font-size:13px}
.seg button.on{background:#fff;color:var(--navy)}
.flags{display:flex;align-items:center;gap:10px}
.iconbtn{color:#cfe0f5;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#ffffff14}
.stage{height:calc(100% - 58px);display:grid;grid-template-columns:270px 1fr 330px;gap:18px;padding:16px 20px}
.side{overflow:auto;color:#dbe8f8;padding-right:4px}
.side h3{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:#7f9cc0;margin:4px 0 10px}
.side .blk{background:#ffffff0d;border:1px solid #ffffff14;border-radius:16px;padding:14px;margin-bottom:14px}
.side .li{display:flex;align-items:center;gap:10px;width:100%;text-align:left;color:#dbe8f8;padding:8px 10px;border-radius:10px;font-size:13px}
.side .li:hover{background:#ffffff14}.side .li svg{color:var(--sky)}
.side .li .n{margin-left:auto;font-size:10px;color:#7f9cc0}
.side p{font-size:12px;line-height:1.5;color:#a9bdd6}
.btnp{display:flex;gap:8px;align-items:center;justify-content:center;width:100%;padding:10px 12px;border-radius:11px;background:linear-gradient(135deg,var(--sky),var(--blue));color:#fff;font-weight:600;font-size:13px;margin-top:8px}
.btnp.gold{background:linear-gradient(135deg,var(--gold),#f0a500);color:#3b2a00}
.btnp.ghost{background:#ffffff14;color:#dbe8f8}
.slot{display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 0}
.slot span{flex:1}.slot label{background:#ffffff14;padding:4px 9px;border-radius:8px;cursor:pointer;font-size:11px}.slot label:hover{background:#ffffff26}
.slot .ok{color:#52d49a;font-size:11px}
.center{display:flex;justify-content:center;align-items:flex-start;overflow:auto;min-width:0}
/* phone */
.phone{width:392px;height:min(810px,calc(100vh - 100px));background:#05080d;border-radius:50px;padding:11px;box-shadow:0 30px 80px #000a,0 0 0 2px #26364c,inset 0 0 0 2px #111;flex:none;position:relative}
.screen{position:relative;height:100%;border-radius:40px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;isolation:isolate}
.status{height:34px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 26px 0;font-size:13px;font-weight:700;background:var(--navy);color:#fff;position:relative;z-index:3}
.status:after{content:"";position:absolute;left:50%;top:8px;transform:translateX(-50%);width:84px;height:20px;border-radius:12px;background:#05080d}
.status .si{display:flex;gap:5px;align-items:center}.status svg{width:15px;height:15px}
.app{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative}
.app::-webkit-scrollbar{display:none}
.nav{flex:none;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 6px 10px;position:relative;z-index:3}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--mut);padding:5px 0;border-radius:12px;font-weight:600;position:relative}
.nav button.on{color:var(--blue)}
.nav button.on:before{content:"";position:absolute;top:-7px;width:26px;height:3px;border-radius:3px;background:var(--sky)}
/* hero */
.hero{background:linear-gradient(160deg,var(--navy),var(--navy2) 60%,#0e5a8f);color:#fff;padding:14px 16px 62px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:26px solid #ffffff0b}
.hrow{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.hrow .tt{flex:1}.hrow b{font-size:17px;letter-spacing:.4px;display:block}.hrow small{font-size:10.5px;color:#a9c3e0;line-height:1.2;display:block}
.pill{display:flex;background:#ffffff1f;border-radius:20px;padding:2px}
.pill button{color:#cfe0f5;padding:4px 9px;border-radius:16px;font-size:11px;font-weight:700}.pill button.on{background:#fff;color:var(--navy)}
.bell{position:relative;width:34px;height:34px;border-radius:50%;background:#ffffff1f;display:grid;place-items:center;color:#fff}
.bell i{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--gold);color:#3b2a00;font-size:10px;font-weight:800;display:grid;place-items:center;font-style:normal;padding:0 4px}
.hello{margin-top:16px;position:relative;z-index:1}.hello small{color:#a9c3e0;font-size:12px}.hello h1{font-size:21px;line-height:1.2;margin-top:2px}
.pad{padding:0 14px}
.lift{margin-top:-44px;position:relative;z-index:2}
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 2px 10px #0a254012;border:1px solid #edf1f6}
.today{display:flex;flex-direction:column;gap:10px}
.today .tr{display:flex;justify-content:space-between;align-items:center}
.today .tr small{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.today .tr b{font-size:13px}
.nextl{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#eaf6fb,#eef3fb);border-radius:14px;padding:12px}
.nextl .tm{background:var(--navy);color:#fff;border-radius:12px;padding:8px 10px;text-align:center;font-weight:800;line-height:1.1;min-width:58px}
.nextl .tm span{display:block;font-size:10px;font-weight:500;color:#a9c3e0}
.nextl b{display:block;font-size:14.5px}.nextl small{color:var(--mut);font-size:12px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 9px}
.sec h3{font-size:15px}.sec a,.sec button.lk{color:var(--blue);font-size:12px;font-weight:700}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px}
.qa button{background:#fff;border-radius:16px;padding:11px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;font-weight:700;box-shadow:0 2px 8px #0a25400d;border:1px solid #edf1f6;color:var(--ink)}
.qa .ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff}
.urg{border-left:4px solid var(--bad);background:#fff;border-radius:14px;padding:11px 12px;margin-bottom:8px;box-shadow:0 2px 8px #0a25400d;cursor:pointer}
.urg b{font-size:13px;display:block}.urg small{color:var(--mut)}
.urg .tag{color:var(--bad);font-weight:800;font-size:10px;letter-spacing:.8px}
.hs{display:flex;gap:10px;overflow-x:auto;padding:2px 14px 6px;margin:0 -14px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.ev{flex:none;width:150px;background:#fff;border-radius:16px;padding:12px;border:1px solid #edf1f6;box-shadow:0 2px 8px #0a25400d}
.ev .d{display:inline-block;background:var(--navy);color:#fff;border-radius:9px;padding:3px 8px;font-size:11px;font-weight:700}
.ev b{display:block;margin:8px 0 3px;font-size:12.5px;line-height:1.25}.ev small{color:var(--mut);font-size:11px}
.banner-about{display:block;width:100%;text-align:left;margin-top:18px;border-radius:18px;overflow:hidden;position:relative;height:130px;background:var(--navy)}
.banner-about .ph{position:absolute;inset:0}
.banner-about .tx{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 12px;background:linear-gradient(transparent,#06182cdd);color:#fff}
.banner-about .tx b{font-size:15px;display:block}.banner-about .tx small{color:#c3d6ee}
.kz-foot{display:flex;align-items:center;justify-content:center;gap:12px;margin:6px 16px 18px;padding:12px;color:var(--mut);font-size:11px;line-height:1.35;text-align:left}.kz-foot>span:first-child{display:flex;gap:10px;align-items:center}
.symb{display:flex;align-items:center;gap:12px;margin:20px 0 16px;padding:12px;border-radius:14px;background:#fff;border:1px dashed #cfd9e6;color:var(--mut);font-size:11px;line-height:1.35}
/* photo */
.ph{position:relative;width:100%;height:100%;min-height:80px;overflow:hidden;background:linear-gradient(135deg,#123a66,#0e6f9c 60%,#00afca)}
.ph .ill{position:absolute;inset:0;display:grid;place-items:center;color:#ffffff40}
.ph .ill svg{width:70%;height:70%}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .4s}
.ph .cap{position:absolute;left:8px;bottom:6px;color:#fff;font-size:11px;font-weight:700;text-shadow:0 1px 4px #000a}
/* sub header */
.sh{display:flex;align-items:center;gap:8px;padding:12px 12px 10px;background:#fff;position:sticky;top:0;z-index:4;border-bottom:1px solid var(--line)}
.sh h2{font-size:17px;flex:1}
.sh .bk{width:34px;height:34px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.pg{padding:12px 14px 22px}
.ttl{padding:14px 16px 4px}.ttl h2{font-size:22px}.ttl small{color:var(--mut)}
.tabs{display:flex;background:#e6ecf4;border-radius:13px;padding:3px;margin:10px 14px 4px}
.tabs button{flex:1;padding:8px 4px;border-radius:10px;font-weight:700;font-size:12.5px;color:var(--mut)}
.tabs button.on{background:#fff;color:var(--navy);box-shadow:0 1px 4px #0a254018}
.chips{display:flex;gap:7px;overflow-x:auto;padding:8px 14px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:6px 12px;border-radius:18px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--mut)}
.chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.sb{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:0 12px;margin:10px 14px 2px;height:42px;color:var(--mut)}
.sb input{flex:1;border:0;outline:0;background:transparent;height:100%;color:var(--ink)}
.chip{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:8px;background:#e8eef6;color:#46566d}
.chip.lec{background:#e7f0ff;color:#1d56b8}.chip.lab{background:#e5f7f1;color:#0c7a53}.chip.pr{background:#fff1de;color:#b36200}
.chip.warn{background:#fff1de;color:#b36200}.chip.bad{background:#fde8e8;color:#b53030}.chip.ok{background:#e1f6ec;color:#0c7a53}.chip.info{background:#e3f4fa;color:#05718a}
.c-study{background:#e7f0ff;color:#1d56b8}.c-urgent{background:#fde8e8;color:#b53030}.c-events{background:#f3e8ff;color:#7a35c2}.c-practice{background:#e1f6ec;color:#0c7a53}.c-safety{background:#fff1de;color:#b36200}.c-contests{background:#ffeaf2;color:#b5316a}.c-applicants{background:#e3f4fa;color:#05718a}
/* week */
.week{display:flex;gap:6px;padding:6px 14px 0}
.week button{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:7px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);font-weight:600}
.week button b{font-size:16px;color:var(--ink)}
.week button.on{background:var(--navy);border-color:var(--navy);color:#a9c3e0}.week button.on b{color:#fff}
.week button.td:not(.on){border-color:var(--sky)}
.week button .dot{width:5px;height:5px;border-radius:50%;background:var(--warn)}
.les{display:flex;gap:12px;background:#fff;border-radius:16px;padding:12px;margin-bottom:9px;border:1px solid #edf1f6;box-shadow:0 2px 8px #0a25400a}
.les .lt{width:50px;flex:none;text-align:center;border-right:2px solid var(--line);padding-right:10px}
.les .lt b{display:block;font-size:15px}.les .lt span{font-size:11px;color:var(--mut)}
.les .ls{font-weight:700;font-size:14px}.les .lm{display:flex;gap:4px;flex-wrap:wrap;align-items:center;color:var(--mut);font-size:12px;margin:3px 0 6px}.les .lm svg{width:13px;height:13px}
.les .lc{display:flex;gap:5px;flex-wrap:wrap}.les .ln{margin-top:6px;font-size:12px;color:#b36200;font-weight:600}
.les.chg{border-color:#f5c98a;background:#fffaf2}.les.can{border-color:#f2b3b3;background:#fff6f6}.les.can .ls{text-decoration:line-through;color:var(--mut)}
.les.now{border-color:var(--sky);box-shadow:0 0 0 3px #00afca22}
.sync{display:flex;gap:8px;align-items:center;margin:10px 14px 0;padding:8px 12px;border-radius:12px;background:#eaf6fb;color:#05718a;font-size:11.5px;font-weight:600}
.sync.off{background:#fff1de;color:#b36200}
.empty{text-align:center;color:var(--mut);padding:36px 20px}.empty svg{width:42px;height:42px;opacity:.4;margin-bottom:8px}
/* calendar */
.cal{background:#fff;border-radius:18px;padding:12px;margin:10px 14px;border:1px solid #edf1f6}
.cal .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.cal .ch b{font-size:15px}
.cal .ch button{width:32px;height:32px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cg .dw{font-size:10.5px;color:var(--mut);font-weight:700;padding:4px 0}
.cg button{height:38px;border-radius:10px;font-size:13px;font-weight:600;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cg button.o{color:#b7c2d1}.cg button.rg{background:#e6f6f8}.cg button.td{outline:2px solid var(--sky);outline-offset:-2px}
.cg button.sel{background:var(--navy);color:#fff}
.cg .dd{display:flex;gap:2px;height:5px}.cg .dd i{width:5px;height:5px;border-radius:50%}
.leg{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px;font-size:11px;color:var(--mut)}.leg span{display:flex;align-items:center;gap:5px}.leg i{width:8px;height:8px;border-radius:50%}
.t-event{background:#0f5fb8}.t-contest{background:#c23b7b}.t-practice{background:#00a3a3}.t-exam{background:#d64545}.t-vacation{background:#14935a}.t-holiday{background:#e8a800}
.row{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:12px;margin-bottom:9px;border:1px solid #edf1f6;box-shadow:0 2px 8px #0a25400a;width:100%;text-align:left}
.row .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.row .tx{flex:1;min-width:0}.row .tx b{display:block;font-size:13.5px;line-height:1.25}.row .tx small{color:var(--mut);font-size:11.5px}
.row .ar{color:#b0bccb}
/* news */
.nw{display:block;width:100%;text-align:left;background:#fff;border-radius:16px;padding:13px;margin-bottom:9px;border:1px solid #edf1f6;box-shadow:0 2px 8px #0a25400a}
.nw.u{border-left:4px solid var(--bad)}
.nw .nh{display:flex;gap:6px;align-items:center;margin-bottom:6px;color:var(--mut);font-size:11px}
.nw b{font-size:14px;line-height:1.3;display:block}.nw p{color:#52627a;font-size:12.5px;margin-top:5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* services */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sv{background:#fff;border-radius:18px;padding:14px 12px;border:1px solid #edf1f6;box-shadow:0 2px 8px #0a25400a;text-align:left;display:flex;flex-direction:column;gap:8px;position:relative}
.sv .ib{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#fff}
.sv b{font-size:13.5px}.sv small{color:var(--mut);font-size:11px;line-height:1.3}
.sv .st{position:absolute;top:10px;right:10px;font-size:9.5px;background:#e8eef6;color:#5b6b82;border-radius:6px;padding:2px 6px;font-weight:700}
/* profile */
.pf{display:flex;gap:14px;align-items:center}
.av{width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,var(--sky),var(--blue));display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px;margin-top:12px}.kv span{color:var(--mut)}.kv b{text-align:right}
.set{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.set:last-child{border:0}.set .tx{flex:1}.set b{display:block;font-size:13.5px}.set small{color:var(--mut);font-size:11.5px}
.sw{width:44px;height:26px;border-radius:14px;background:#cfd8e3;position:relative;transition:.2s;flex:none}.sw:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px #0003}.sw.on{background:var(--ok)}.sw.on:after{left:21px}
.segs{display:flex;background:#e6ecf4;border-radius:11px;padding:3px}.segs button{padding:6px 10px;border-radius:8px;font-size:11.5px;font-weight:700;color:var(--mut)}.segs button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px #0a254018}
/* forms */
.fld{margin-bottom:12px}.fld label{display:block;font-size:12px;font-weight:700;color:#44546b;margin-bottom:5px}
.fld input,.fld textarea,.fld select,.admin input,.admin textarea,.admin select{width:100%;border:1px solid #d6dfeb;border-radius:11px;padding:10px 12px;background:#fff;outline:0;font-size:13.5px}
.fld input:focus,.fld textarea:focus,.fld select:focus,.admin input:focus,.admin textarea:focus,.admin select:focus{border-color:var(--sky);box-shadow:0 0 0 3px #00afca22}
textarea{resize:vertical;min-height:80px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border-radius:13px;background:linear-gradient(135deg,var(--blue),#0a4a96);color:#fff;font-weight:700;font-size:14px}
.btn.sec2{background:#e8eef6;color:var(--navy)}.btn.ok{background:var(--ok)}.btn.sm{padding:8px 12px;font-size:12.5px;width:auto;border-radius:10px}.btn.bad{background:var(--bad)}
.btn:disabled{opacity:.5}
.note{display:flex;gap:9px;background:#fff7e6;border:1px solid #f6dca8;color:#7a5200;border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.4;margin-bottom:12px}
.note.blue{background:#e9f4fb;border-color:#b9dff0;color:#065a73}.note.red{background:#fdecec;border-color:#f3bcbc;color:#8a2323}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:#fff;border-radius:14px;padding:10px 6px;text-align:center;border:1px solid #edf1f6}.stats b{display:block;font-size:19px;color:var(--blue)}.stats small{font-size:10.5px;color:var(--mut)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pgrid .ph{height:96px;border-radius:14px}
/* gallery */
.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gal button{height:130px;border-radius:16px;overflow:hidden;position:relative;display:block;text-align:left}
.gal .ov{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;background:linear-gradient(transparent,#041428dd);color:#fff;font-size:12px;font-weight:700}.gal .ov small{display:block;font-weight:400;color:#c3d6ee;font-size:10.5px}
/* honor */
.hn{display:flex;gap:12px;background:#fff;border-radius:16px;padding:12px;margin-bottom:9px;border:1px solid #edf1f6}
.hn .md{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#f0a500);display:grid;place-items:center;color:#3b2a00;flex:none}
.hn b{font-size:13.5px;display:block}.hn small{color:var(--mut);font-size:11.5px}
/* guide */
.acc{background:#fff;border-radius:14px;border:1px solid #edf1f6;margin-bottom:8px;overflow:hidden}
.acc>button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 13px;font-weight:700;font-size:13px}
.acc .an{padding:0 13px 13px;color:#4c5d75;font-size:12.5px;line-height:1.5;display:none}.acc.open .an{display:block}.acc.open>button svg{transform:rotate(90deg)}
/* map */
.mp{background:#e9eff7;border-radius:18px;padding:12px;border:1px solid var(--line)}
.bld{background:#fff;border:2px solid #c3d1e3;border-radius:14px;padding:10px;margin-bottom:10px}.bld h4{font-size:12px;color:var(--mut);margin-bottom:8px;text-transform:uppercase;letter-spacing:.8px}
.bld .zs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.zs button{padding:10px 2px;border-radius:10px;background:#eef3fa;font-size:11px;font-weight:700;color:#35506f}.zs button.on{background:var(--blue);color:#fff}
/* slots */
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.slots button{padding:9px 0;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:700}.slots button.on{background:var(--navy);color:#fff;border-color:var(--navy)}.slots button:disabled{opacity:.35;text-decoration:line-through}
/* sheet */
.sheet{position:absolute;inset:0;z-index:20;pointer-events:none}
.sheet .sh-bg{position:absolute;inset:0;background:#05101e88;opacity:0;transition:.25s}
.sheet .sh-body{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:8px 18px 24px;transform:translateY(100%);transition:.3s cubic-bezier(.2,.8,.2,1)}
.sheet.open{pointer-events:auto}.sheet.open .sh-bg{opacity:1}.sheet.open .sh-body{transform:none}
.grab{width:42px;height:4px;border-radius:3px;background:#d4dce8;margin:4px auto 14px}
.sheet h3{font-size:18px;margin-bottom:6px;line-height:1.25}.sheet p{color:#4c5d75;line-height:1.5;font-size:13.5px;margin-bottom:10px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:12.5px;margin:10px 0 14px;padding:12px;background:var(--bg);border-radius:12px}.dl span{color:var(--mut)}.dl b{text-align:right}
.banner{position:absolute;left:10px;right:10px;top:40px;z-index:30;transform:translateY(-140%);transition:.4s cubic-bezier(.2,.8,.2,1)}.banner.show{transform:none}
.bn{display:flex;gap:10px;align-items:center;background:#ffffffee;backdrop-filter:blur(10px);border-radius:18px;padding:10px 12px;box-shadow:0 10px 30px #0006;cursor:pointer}
.bn small{display:block;color:var(--mut);font-size:10.5px}.bn b{display:block;font-size:13px}.bn span{font-size:12px;color:#4c5d75;display:block;line-height:1.3}
.ptoast{position:absolute;left:50%;bottom:84px;transform:translate(-50%,30px);background:#0a2540;color:#fff;padding:10px 16px;border-radius:14px;font-size:12.5px;opacity:0;transition:.3s;z-index:40;pointer-events:none;max-width:88%;text-align:center;box-shadow:0 8px 24px #0005}.ptoast.show{opacity:1;transform:translate(-50%,0)}
.splash{position:absolute;inset:0;z-index:50;overflow:hidden;background:linear-gradient(170deg,#0a2540,#0e5a8f 70%,#00afca);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:30px;transition:opacity .6s}
.splash.hide{opacity:0;pointer-events:none}.splash h1{font-size:30px;letter-spacing:2px}.splash p{color:#c3d6ee;font-size:13px;line-height:1.4}
.splash .fl{box-shadow:0 8px 24px #0005;border-radius:4px;overflow:hidden;line-height:0}
.lg{position:relative;display:inline-grid;place-items:center;border-radius:28%;overflow:hidden;flex:none;background:linear-gradient(135deg,var(--sky),var(--blue));color:#fff}
.lg svg{width:74%;height:74%;overflow:visible}.lg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;transition:opacity .3s}
.toastg{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:100}
.toastg div{background:#0a2540;color:#fff;border:1px solid #ffffff22;padding:11px 16px;border-radius:12px;font-size:13px;box-shadow:0 10px 30px #0006;animation:tin .3s}
@keyframes tin{from{transform:translateY(12px);opacity:0}}
/* admin */
.admin{width:100%;max-width:1180px;height:calc(100vh - 100px);background:#f4f7fb;border-radius:20px;overflow:hidden;display:grid;grid-template-columns:230px 1fr;box-shadow:0 30px 80px #0008}
.adm-s{background:var(--navy);color:#dbe8f8;padding:16px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.adm-b{display:flex;gap:10px;align-items:center;padding:4px 6px 14px}.adm-b b{color:#fff;display:block}.adm-b small{color:#8ea9c9;font-size:11px}
.adm-s .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:#7f9cc0;margin:8px 6px 4px}
.adm-s select{background:#ffffff14;color:#fff;border-color:#ffffff22}.adm-s select option{color:#000}
.at{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:11px;color:#c9daee;font-weight:600;font-size:13px;text-align:left;width:100%}.at:hover{background:#ffffff12}.at.on{background:#fff;color:var(--navy)}.at .bd{margin-left:auto;background:var(--gold);color:#3b2a00;border-radius:9px;font-size:10.5px;font-weight:800;padding:1px 7px}
.adm-n{margin-top:auto;font-size:11px;color:#8ea9c9;line-height:1.4;padding:10px 6px}
.adm-c{padding:22px 26px;overflow:auto}
.adm-c h1{font-size:22px;margin-bottom:4px}.adm-c .sub{color:var(--mut);margin-bottom:18px}
.cards4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:#fff;border-radius:16px;padding:16px;border:1px solid #e6edf5}.stat b{font-size:28px;display:block;color:var(--blue)}.stat small{color:var(--mut)}
.panel{background:#fff;border-radius:16px;padding:18px;border:1px solid #e6edf5;margin-bottom:16px}.panel h3{font-size:15px;margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{text-align:left;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:8px 8px;border-bottom:1px solid var(--line)}.tbl td{padding:9px 8px;border-bottom:1px solid #eef2f7;vertical-align:middle}
.tbl input,.tbl select{padding:7px 9px;font-size:13px}
.lockc{display:flex;gap:14px;align-items:center;background:#fdecec;border:1px solid #f3bcbc;color:#8a2323;border-radius:16px;padding:18px}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:12px}.frm .full{grid-column:1/-1}.frm label{display:block;font-size:12px;font-weight:700;color:#44546b;margin-bottom:5px}
.ib2{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #eef2f7}.ib2:last-child{border:0}.ib2 .tx{flex:1}.ib2 b{display:block}.ib2 small{color:var(--mut)}
.bar{height:10px;border-radius:6px;background:#e6edf5;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--blue))}
.admin button.btn{width:auto;padding:10px 18px;display:inline-flex}
@media(max-width:1180px){.stage{grid-template-columns:240px 1fr}.side.right{display:none}}
@media(max-width:860px){.stage{grid-template-columns:1fr;padding:0}.side{display:none}.top{padding:0 10px}.brand small,.flags{display:none}
.phone{width:100vw;height:calc(100vh - 58px);border-radius:0;padding:0;box-shadow:none}.screen{border-radius:0}.status:after{display:none}
.admin{grid-template-columns:1fr;height:calc(100vh - 58px);border-radius:0}.adm-s{flex-direction:row;overflow-x:auto;align-items:center}.adm-b,.adm-n,.adm-s .lbl{display:none}.cards4{grid-template-columns:1fr 1fr}.two,.frm{grid-template-columns:1fr}}

/* splash + intro */
.sp-mark{width:132px;height:132px;overflow:visible;position:relative;z-index:2;filter:drop-shadow(0 10px 28px #00afca66)}
.lm-hex{fill:none;stroke:#fff;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.lm-ring{fill:none;stroke:var(--sky);stroke-width:5;stroke-dasharray:3.3 3.3;transform-origin:50px 50px}
.lm-atom{fill:var(--gold)}
.lm-n1{fill:var(--gold)}.lm-n2{fill:#fff;opacity:.92}
.lm-needle{transform-origin:50px 50px;transform:rotate(40deg)}
.lm-pin{fill:#0a2540;stroke:#fff;stroke-width:1.6}
.splash .lm-hex{stroke-dasharray:100;stroke-dashoffset:100;animation:lmd 1.1s .55s cubic-bezier(.6,0,.2,1) forwards}
.splash .lm-atom{opacity:0;transform-origin:center;transform-box:fill-box;animation:lma .7s calc(.15s + var(--k)*.07s) cubic-bezier(.3,1.7,.5,1) forwards}
.splash .lm-ring{opacity:0;animation:spf .6s 1.2s forwards,lmr 9s 1.2s linear infinite}
.splash .lm-needle{animation:lmn 1.5s 1.5s cubic-bezier(.17,1.25,.35,1) both}
.splash .lm-pin{opacity:0;animation:spf .3s 1.6s forwards}
.sp-rip{position:absolute;width:132px;height:132px;border-radius:50%;border:2px solid #fec50c;opacity:0;z-index:1;animation:lmp 1.4s 2.3s ease-out}
.sp-rip.b{border-color:#00afca;animation-delay:2.5s}
.sp-wrap{position:relative;display:grid;place-items:center}
.sp-orb{position:absolute;border-radius:50%;filter:blur(40px);opacity:.45;pointer-events:none;animation:spo 7s ease-in-out infinite alternate}
.sp-orb.a{width:220px;height:220px;background:#00afca;left:-70px;top:-60px}
.sp-orb.b{width:200px;height:200px;background:#fec50c;right:-90px;bottom:-60px;opacity:.22;animation-delay:-3s}
.sp-pt{position:absolute;bottom:-10px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;background:#fff;opacity:0;pointer-events:none;animation:spy var(--d) var(--w) linear infinite}
.sp-bar{width:120px;height:3px;border-radius:3px;background:#ffffff26;overflow:hidden;margin-top:14px;position:relative;z-index:2}
.sp-bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--sky),var(--gold));transform:scaleX(0);transform-origin:left;animation:spb 4.4s cubic-bezier(.4,.1,.3,1) forwards}
.sp-t{display:flex;font-size:34px;font-weight:800;letter-spacing:1px;margin-top:8px;position:relative;overflow:hidden;padding:2px 6px;z-index:2}.sp-t:after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,#ffffffa6 50%,transparent 65%);transform:translateX(-130%);animation:sps .9s 2.9s ease-in-out forwards}
.sp-t span{display:inline-block;opacity:0;transform:translateY(18px);animation:spu .5s calc(1.9s + var(--i)*.05s) cubic-bezier(.2,.8,.2,1) forwards}
.sp-tag{position:relative;height:18px;width:100%}
.sp-tag span{position:absolute;inset:0;font-size:13px;color:#c3d6ee;opacity:0}
.sp-tag .a{animation:spio 1.3s 2.6s both}.sp-tag .b{animation:spf .5s 3.8s forwards}
@keyframes lmd{to{stroke-dashoffset:0}}@keyframes lma{from{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}to{opacity:1;transform:none}}@keyframes lmr{to{transform:rotate(360deg)}}@keyframes lmn{from{transform:rotate(-620deg)}to{transform:rotate(40deg)}}@keyframes lmp{0%{opacity:.9;transform:scale(.7)}100%{opacity:0;transform:scale(2.4)}}@keyframes spo{to{transform:translate(30px,26px) scale(1.15)}}@keyframes spy{0%{opacity:0;transform:translateY(0)}15%{opacity:.55}100%{opacity:0;transform:translateY(-560px)}}@keyframes spb{to{transform:scaleX(1)}}@keyframes sps{to{transform:translateX(130%)}}@keyframes spf{to{opacity:1}}
@keyframes spu{to{opacity:1;transform:none}}
@keyframes spio{0%{opacity:0}25%,75%{opacity:1}100%{opacity:0}}
.intro .card,.intro .qa button,.intro .urg,.intro .sec,.intro .hs,.intro .banner-about,.intro .symb{animation:rise .55s calc(var(--i)*.06s) cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
@media(prefers-reduced-motion:reduce){.splash *,.intro *{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}.sp-tag .a,.sp-rip,.sp-pt,.sp-orb{display:none}.lm-needle{transform:rotate(40deg)!important}}
.ph img[data-s=campus]{object-position:28% 60%}

.av{position:relative;overflow:hidden;flex:none;aspect-ratio:1/1;border-radius:50%!important}.av [data-avw]{width:100%;height:100%;display:grid;place-items:center}.av img,.rg-ph img{width:100%;height:100%;object-fit:cover}
.av-cam{position:absolute;right:0;bottom:0;background:#0a2540b0;border-radius:9px 0 0 0;padding:3px;display:grid;font-style:normal}.av-cam svg{width:13px;height:13px}
.reg{position:absolute;inset:0;z-index:45;display:flex;flex-direction:column;background:linear-gradient(170deg,#0a2540,#0e5a8f 75%,#00afca);transform:translateY(100%);transition:transform .5s cubic-bezier(.2,.8,.2,1)}.reg.on{transform:none}
.rg-top{padding:14px 18px 0;color:#fff;display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;flex:none}.rg-top .pill{align-self:flex-end}

.rg-card{position:relative;flex:1;min-height:0;margin-top:50px;background:#fff;border-radius:28px 28px 0 0;display:flex;flex-direction:column}
.rg-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;border-radius:28px 28px 0 0;padding:52px 20px calc(20px + var(--kb,0px));-webkit-mask-image:linear-gradient(#0000 0,#0000 22px,#000 50px);mask-image:linear-gradient(#0000 0,#0000 22px,#000 50px)}.rg-scroll::-webkit-scrollbar{display:none}
.rg-ph{cursor:default;display:grid;place-items:center;width:92px;height:92px;margin:0;position:absolute;top:-46px;left:50%;margin-left:-46px;z-index:3;flex:none;border-radius:50%;background:linear-gradient(135deg,var(--sky),var(--blue));border:4px solid #fff;color:#fff;font-size:34px;font-weight:800;cursor:pointer;box-shadow:0 6px 18px #0a254033}
.rg-ph [data-avw]{width:100%;height:100%;border-radius:50%;overflow:hidden;display:grid;place-items:center}
.rg-ph i{position:absolute;right:-2px;bottom:2px;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#3b2a00;display:grid;place-items:center}
.rg-cap{display:block;text-align:center;color:var(--mut);font-size:11.5px;margin-bottom:14px}
.rg-ph i{z-index:1}
@media(max-width:380px){.rg-scroll{padding-left:16px;padding-right:16px}.rg-top h1{font-size:21px}}
.reg.kb .rg-top{padding-top:8px;gap:2px}.reg.kb .rg-top svg,.reg.kb .rg-top p{display:none}.reg.kb .rg-top h1{font-size:18px}
.reg.kb .rg-card{margin-top:38px}.reg.kb .rg-ph{width:64px;height:64px;top:-32px;margin-left:-32px;font-size:24px}.reg.kb .rg-ph i{width:22px;height:22px}.reg.kb .rg-scroll{padding-top:38px}
@media(max-height:560px){.reg .rg-top svg,.reg .rg-top p{display:none}}
.rg-skip{display:block;width:100%;margin-top:8px;padding:10px;color:var(--blue);font-weight:700;font-size:13px}
</style>

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const startOfDay=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};

function symErr(i){const u=symList(i.dataset.k),n=+i.dataset.n;if(u[n]){i.dataset.n=n+1;i.src=u[n]}else i.style.display='none'}
function symImg(k,st,alt){return `<img src="${symList(k)[0]}" data-k="${k}" data-n="1" alt="${alt}" style="display:block;${st}" onerror="symErr(this)">`}
function FLAG(w){w=w||60;return symImg('flag',`width:${w}px;height:${Math.round(w*330/588)}px;box-shadow:0 0 0 1px #0002;border-radius:2px`,'Флаг Республики Казахстан')}
function EMBLEM(s){s=s||48;return symImg('emblem',`width:${s}px;height:auto`,'Герб Республики Казахстан')}

function audOK(a){if(a==='all')return true;if(S.role==='guest')return false;if(S.role==='teacher')return true;return a==='course:'+ME.course||a==='group:'+ME.group}

function mySched(dow){
  const src=S.role==='teacher'?TSCHED:SCHED;
  return (src[dow]||[]);
}
function nextLesson(){
  const ls=mySched(TODAY.getDay());const now=new Date(),nm=now.getHours()*60+now.getMinutes();
  for(const l of ls){if(l.state==='cancelled')continue;const p=l.t.split('–');if(nm>=mins(p[0])&&nm<mins(p[1]))return {l,cur:true};}
  for(const l of ls){if(l.state==='cancelled')continue;if(mins(l.t.split('–')[0])>nm)return {l,cur:false};}
  return null;
}
function toast(m){
  if(S.view==='app'){const p=$('#ptoast');p.textContent=m;p.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>p.classList.remove('show'),2300);}
  else{const d=document.createElement('div');d.textContent=m;$('#toastg').appendChild(d);setTimeout(()=>d.remove(),3200);}
}
function audit(msg,actor){S.audit.unshift({ts:new Date(),actor:actor||ROLEL[S.admRole],msg})}

function calHtml(){
  const m=S.calMonth,y=m.getFullYear(),mo=m.getMonth(),first=new Date(y,mo,1),off=(first.getDay()+6)%7,dim=new Date(y,mo+1,0).getDate();

  for(let d=1;d<=dim;d++){const dt=new Date(y,mo,d),es=eventsOn(dt),single=es.filter(e=>e.len===1),rng=es.some(e=>e.len>1);
    cells+=`<button class="${sameDay(dt,TODAY)?'td ':''}${sameDay(dt,S.calSel)?'sel ':''}${rng&&!sameDay(dt,S.calSel)?'rg':''}" data-a="calSel" data-v="${y}-${mo}-${d}">${d}<span class="dd">${es.slice(0,3).map(e=>`<i class="t-${e.type}"></i>`).join('')}</span></button>`;}
  const sel=eventsOn(S.calSel),up=EVENTS.filter(e=>e.off>=0).slice(0,5);
  return `<div class="cal"><div class="ch"><button data-a="calMove" data-v="-1" aria-label="Предыдущий месяц">${ic('back')}</button><b>${MON_N[S.lang][mo]} ${y}</b><button data-a="calMove" data-v="1" aria-label="Следующий месяц">${ic('chev')}</button></div><div class="cg">${[1,2,3,4,5,6,0].map(i=>`<span class="dw">${DOW_SH[S.lang][i]}</span>`).join('')}${cells}</div></div>

  <div class="pg"><div class="sec" style="margin-top:6px"><h3>${fmtD(S.calSel)}</h3></div>${sel.length?sel.map(e=>`<div class="row"><span class="ic t-${e.type}">${ic('cal')}</span><div class="tx"><b>${esc(e.title)}</b><small>${ETYPE[e.type]}${e.place?' · '+esc(e.place):''}${e.len>1?' · '+e.len+' дн.':''}</small></div></div>`).join(''):`<div class="empty" style="padding:14px">Событий нет</div>`}

}

function applySched(day,id,patch){
  const l=SCHED[day].find(x=>x.id===id);if(!l)return;Object.assign(l,patch);
}
function publishChange(day,list,actor){
  S.schedVersion++;S.lastSync=new Date();
  const d=dateOfDow(day);
  list.forEach(c=>{audit(`Расписание ${DOW_FULL.ru[day]}: ${c.l.subj} — ${c.note}`,actor)});
  notify({kind:'schedule',title:'Изменение расписания',body:`${DOW_FULL.ru[day]}, ${fmtD(d)}: ${list[0].l.subj} — ${list[0].note}${list.length>1?` (+ ещё ${list.length-1})`:''}`,target:'schedule'});
  S.selDow=day;
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=ACT[el.dataset.a];if(!a)return;
  const d=Object.assign({},el.dataset);if(d.docTab){S.docTab=d.docTab}
  if(el.dataset.a==='demoGo'&&el.dataset.tab){d.tab=el.dataset.tab}
  a(d,el,e);
});
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-i]');if(!el)return;
  const k=el.dataset.i;S.q[k]=el.value;
  const tgt=$('#'+({news:'newsList',doc:'docList',guide:'guideList'}[k]));
  if(tgt){tgt.innerHTML=({news:newsList,doc:docList,guide:guideList}[k])();loc(tgt)}
});
document.addEventListener('change',e=>{
  const c=e.target.closest('[data-c]');
  if(c&&c.dataset.c==='admRole'){S.admRole=c.value;renderAdmin();return}
  const f=e.target.closest('input[type=file]');if(!f||!f.files||!f.files.length)return;
  if(f.hasAttribute('data-avatar'))return;
  if(f.dataset.slot){PHOTO_URLS[f.dataset.slot]=URL.createObjectURL(f.files[0]);renderSide();render(true);if(S.view==='admin')renderAdmin(true);renderTop();toast('Фото загружено')}
  else if(f.hasAttribute('data-bulk')){
    let n=0;[...f.files].forEach(file=>{const k=file.name.replace(/\.[^.]+$/,'').toLowerCase();if(SLOTS.some(s=>s[0]===k)){PHOTO_URLS[k]=URL.createObjectURL(file);n++}});
    renderSide();render(true);renderTop();toast(n?'Загружено файлов: '+n:'Назовите файлы как campus, lab, workshop, technopark, library, g1…g6, logo');
  }
});

  <div class="rg-card"><div class="rg-ph" aria-hidden="true"><span data-avw data-n="${esc(g.name)}">${avInner(g.name)}</span></div><div class="rg-scroll">
  <h3 style="font-size:19px;margin-bottom:12px;text-align:center">Регистрация студента</h3>
  <div class="fld"><label>ФИО</label><input data-r="name" value="${esc(g.name)}" placeholder="Например: Айдар Серіков" autocomplete="off"></div>
  <div class="fld"><label>ИИН</label><div style="display:flex;gap:8px"><input data-r="iin" inputmode="numeric" maxlength="12" value="${esc(g.iin)}"><button class="btn sm sec2" data-a="rndIin" aria-label="ИИН">${ic('gear')}</button></div><small style="color:var(--mut);font-size:11px">Сгенерирован случайно (демо)</small></div>
  <button class="btn" data-a="regDone">${ic('check')} Зарегистрироваться</button><button class="rg-skip" data-a="regGuest">Продолжить как гость</button><p style="text-align:center;color:var(--mut);font-size:11px;margin-top:4px">Демо: проверка данных не выполняется</p></div></div>`;
  const ns=r.querySelector('.rg-scroll');if(ns)ns.scrollTop=st;
  loc(r);
}
(function(){const vv=window.visualViewport;
  const upd=()=>{const r=$('#reg');if(!r||!vv)return;const kb=Math.max(0,Math.round(innerHeight-vv.height-vv.offsetTop));r.style.setProperty('--kb',kb+'px');r.classList.toggle('kb',kb>120||vv.height<520)};
  if(vv){vv.addEventListener('resize',upd);vv.addEventListener('scroll',upd)}
  document.addEventListener('focusin',e=>{const t=e.target;if(t.matches&&t.matches('#reg input')){setTimeout(()=>{upd();t.scrollIntoView({block:'center',behavior:'smooth'})},320)}});
})();
function showReg(){const r=$('#reg');r.hidden=false;renderReg();void r.offsetWidth;r.classList.add('on')}
function hideReg(){const r=$('#reg');r.classList.remove('on');setTimeout(()=>{r.hidden=true},500)}
Object.assign(ACT,{
 rndIin:()=>{S.reg.iin=rndIin();const e=$('[data-r=iin]');if(e)e.value=S.reg.iin},
 regDone:()=>{ME.name=(S.reg.name||'').trim()||'Студент';S.role='student';S.registered=true;S.stack=['home'];hideReg();render();setTimeout(introGo,350);toast('Регистрация выполнена · добро пожаловать!')},
 regGuest:()=>{S.role='guest';S.registered=true;S.stack=['home'];hideReg();render();setTimeout(introGo,350)},
 regOpen:()=>{ACT.view({v:'app'});S.reg.iin=rndIin();showReg()}
});
document.addEventListener('input',e=>{const el=e.target.closest('[data-r]');if(!el)return;if(el.dataset.r==='iin')el.value=el.value.replace(/\D/g,'');S.reg[el.dataset.r]=el.value;if(el.dataset.r==='name'){const a=$('#reg [data-avw]');if(a){a.dataset.n=el.value;if(!S.photo)a.innerHTML=avInner(el.value)}}});
{const o=window.renderAll;window.renderAll=function(){const r=o.apply(this,arguments);if(!$('#reg').hidden)renderReg();return r}}
renderTop();renderSide();render();startSplash();
</script>
</body>
</html>
